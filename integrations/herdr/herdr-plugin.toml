id = "shogunai.worktrees"
name = "ShogunAi"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Provision the worktrees Herdr creates with ShogunAi: local files, secrets, reserved ports and environment file"
platforms = ["linux", "macos", "windows"]

[[events]]
on = "worktree.created"
command = ["shogun", "hook", "herdr"]
