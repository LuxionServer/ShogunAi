name: Test suite

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}

      - name: Run tests
        shell: bash
        run: ./gradlew test

      - name: Verify coverage
        id: coverage
        if: runner.os == 'macOS'
        shell: bash
        run: ./gradlew koverVerify

      - name: Generate coverage reports
        if: failure() && steps.coverage.outcome == 'failure'
        shell: bash
        run: ./gradlew koverXmlReport koverHtmlReport

      - name: Upload coverage reports
        if: failure() && steps.coverage.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: kover-reports-${{ matrix.os }}
          path: |
            */build/reports/kover/report.xml
            */build/reports/kover/html/
          retention-days: 14
          if-no-files-found: warn
