name: Release

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
    types: [closed]
    branches: [main]

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  resolve-version:
    if: >
      github.event_name == 'push' ||
      (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      ref: ${{ steps.version.outputs.ref }}
    steps:
      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            VERSION="${BRANCH#release/}"
            REF="$MERGE_SHA"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
            REF="$GITHUB_REF"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must match X.Y.Z (digits only), got: $VERSION" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

  test:
    needs: resolve-version
    permissions:
      contents: read
    uses: ./.github/workflows/test-suite.yml
    with:
      ref: ${{ needs.resolve-version.outputs.ref }}

  create-release:
    needs: [resolve-version, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.resolve-version.outputs.version }}
      REF: ${{ needs.resolve-version.outputs.ref }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Tag merge commit
        if: github.event_name == 'pull_request'
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/v${VERSION}" \
            -f sha="$REF"

      - name: Create draft release
        run: |
          gh release create "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --generate-notes

  build:
    needs: [resolve-version, create-release]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            task: packageReleaseDmg
            artifact-glob: desktopApp/build/compose/binaries/main-release/dmg/*.dmg
          - os: macos-26-intel
            task: packageReleaseDmg
            artifact-glob: desktopApp/build/compose/binaries/main-release/dmg/*.dmg
          - os: windows-latest
            task: packageReleaseMsi
            artifact-glob: desktopApp/build/compose/binaries/main-release/msi/*.msi
          - os: ubuntu-latest
            task: packageReleaseDeb
            artifact-glob: desktopApp/build/compose/binaries/main-release/deb/*.deb

    runs-on: ${{ matrix.os }}

    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.ref }}
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build installer
        env:
          TASK: ${{ matrix.task }}
        run: ./gradlew ":desktopApp:${TASK}" "-PappVersion=${VERSION}"

      - name: Name dmg after release version and architecture
        if: runner.os == 'macOS'
        run: |
          ARCH="$(echo "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
          shopt -s nullglob
          DMGS=(desktopApp/build/compose/binaries/main-release/dmg/*.dmg)
          if [ "${#DMGS[@]}" -ne 1 ]; then
            echo "Expected exactly one dmg, found ${#DMGS[@]}." >&2
            exit 1
          fi
          mv "${DMGS[0]}" "desktopApp/build/compose/binaries/main-release/dmg/ShogunAi-${VERSION}-${ARCH}.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error

  build-cli:
    needs: [resolve-version, create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.ref }}
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build CLI zip
        run: ./gradlew :cli:distZip "-PappVersion=${VERSION}"

      - uses: actions/upload-artifact@v7
        with:
          name: cli
          path: cli/build/distributions/shogun-${{ needs.resolve-version.outputs.version }}.zip
          if-no-files-found: error

  publish-release:
    needs: [resolve-version, build, build-cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS

      - name: Upload assets and publish release
        run: |
          gh release upload "v${VERSION}" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "v${VERSION}" --repo "$GITHUB_REPOSITORY" --draft=false

  update-homebrew-cask:
    needs: [resolve-version, publish-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.ref }}
          path: source
          persist-credentials: false

      - name: Read checksums from the release
        id: sha
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}"
          curl -sL -f -o SHA256SUMS "${BASE_URL}/SHA256SUMS"
          echo "arm=$(grep -F " ShogunAi-${VERSION}-arm64.dmg" SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "intel=$(grep -F " ShogunAi-${VERSION}-x64.dmg" SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
          SHA256_ARM: ${{ steps.sha.outputs.arm }}
          SHA256_INTEL: ${{ steps.sha.outputs.intel }}
        run: |
          if [ -z "$SHA256_ARM" ] || [ -z "$SHA256_INTEL" ]; then
            echo "Missing dmg checksums in SHA256SUMS." >&2
            exit 1
          fi

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/LuxionServer/homebrew-shogunai.git" tap

          sed -e "s|@VERSION@|${VERSION}|" \
              -e "s|@SHA256_ARM@|${SHA256_ARM}|" \
              -e "s|@SHA256_INTEL@|${SHA256_INTEL}|" \
              source/.github/homebrew/shogunai.rb > tap/Casks/shogunai.rb

          cat tap/Casks/shogunai.rb

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/shogunai.rb

          if git diff --cached --quiet; then
            echo "Cask already up to date, nothing to commit."
          else
            git commit -m "Update shogunai cask to v${VERSION}"
            git push
          fi

  update-scoop-bucket:
    needs: [resolve-version, publish-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.ref }}
          path: source
          persist-credentials: false

      - name: Read checksum from the release
        id: sha
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}"
          curl -sL -f -o SHA256SUMS "${BASE_URL}/SHA256SUMS"
          echo "msi=$(grep -F " ShogunAi-${VERSION}.msi" SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Update Scoop bucket
        env:
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
          SHA256_MSI: ${{ steps.sha.outputs.msi }}
        run: |
          if [ -z "$SHA256_MSI" ]; then
            echo "Missing msi checksum in SHA256SUMS." >&2
            exit 1
          fi

          git clone "https://x-access-token:${SCOOP_BUCKET_TOKEN}@github.com/LuxionServer/scoop-shogunai.git" bucket
          mkdir -p bucket/bucket

          sed -e "s|@VERSION@|${VERSION}|g" \
              -e "s|@SHA256_MSI@|${SHA256_MSI}|" \
              source/.github/scoop/shogunai.json > bucket/bucket/shogunai.json

          cat bucket/bucket/shogunai.json

          cd bucket
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/shogunai.json

          if git diff --cached --quiet; then
            echo "Manifest already up to date, nothing to commit."
          else
            git commit -m "Update shogunai to v${VERSION}"
            git push
          fi

  update-winget:
    needs: [resolve-version, publish-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54
        with:
          identifier: LuxionServer.ShogunAi
          version: ${{ needs.resolve-version.outputs.version }}
          release-tag: v${{ needs.resolve-version.outputs.version }}
          installers-regex: '\.msi$'
          token: ${{ secrets.WINGET_TOKEN }}
