name: Release

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  resolve-version:
    if: >
      github.event_name == 'push' ||
      (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.ref }}

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH="${{ github.event.pull_request.head.ref }}"
            VERSION="${BRANCH#release/}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      # git tag directamente sobre push de tag no hace falta re-crearlo;
      # solo se taggea acá cuando el disparo fue el merge de la PR de release/*.
      - name: Tag merge commit
        if: github.event_name == 'pull_request'
        run: |
          git tag "v${{ steps.version.outputs.value }}" ${{ github.event.pull_request.merge_commit_sha }}
          git push origin "v${{ steps.version.outputs.value }}"

  # Crea la release en modo draft una sola vez: evita que cada job del matrix
  # genere sus propias notas (se triplicaba el changelog) y mantiene la release
  # editable mientras los assets se suben en paralelo (una release publicada es
  # inmutable y rechaza nuevos uploads).
  create-release:
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.resolve-version.outputs.version }}
          draft: true
          generate_release_notes: true

  build:
    needs: [resolve-version, create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            task: packageReleaseDmg
            artifact-glob: desktopApp/build/compose/binaries/main-release/dmg/*.dmg
          - os: windows-latest
            task: packageReleaseMsi
            artifact-glob: desktopApp/build/compose/binaries/main-release/msi/*.msi
          - os: ubuntu-latest
            task: packageReleaseDeb
            artifact-glob: desktopApp/build/compose/binaries/main-release/deb/*.deb

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build installer
        run: ./gradlew :desktopApp:${{ matrix.task }} -PappVersion=${{ needs.resolve-version.outputs.version }}

      - name: Upload asset to draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.resolve-version.outputs.version }}
          files: ${{ matrix.artifact-glob }}
          draft: true

  publish-release:
    needs: [resolve-version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.resolve-version.outputs.version }}
          draft: false

  update-homebrew-cask:
    needs: [resolve-version, publish-release]
    runs-on: ubuntu-latest
    steps:
      # jpackage versiona el .dmg de macOS como "1.<minor>.<patch>" en vez del
      # tag real "0.<minor>.<patch>" (ver design.md de homebrew-cask-distribution).
      # El Cask deriva la misma transformación desde `version`, así que acá
      # solo hace falta reproducirla para descargar el .dmg correcto.
      - name: Download macOS dmg and compute sha256
        id: sha
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          DMG_VERSION="1.${VERSION#*.}"
          DMG_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/ShogunAi-${DMG_VERSION}.dmg"
          curl -sL -f -o app.dmg "$DMG_URL"
          echo "value=$(sha256sum app.dmg | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # HOMEBREW_TAP_TOKEN es un fine-grained PAT con permiso de escritura
      # (Contents) limitado al repo del tap: GITHUB_TOKEN no puede pushear a
      # otro repositorio. El `url` del Cask no se toca: ya está parametrizado
      # con `#{version}` y deriva el sufijo del .dmg en Ruby.
      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
          SHA256: ${{ steps.sha.outputs.value }}
        run: |
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/LuxionServer/homebrew-shogunai.git" tap
          cd tap

          sed -i "s|^  version \".*\"\$|  version \"${VERSION}\"|" Casks/shogunai.rb
          sed -i "s|^  sha256 \".*\"\$|  sha256 \"${SHA256}\"|" Casks/shogunai.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/shogunai.rb

          if git diff --cached --quiet; then
            echo "Cask already up to date, nothing to commit."
          else
            git commit -m "Update shogunai cask to v${VERSION}"
            git push
          fi
