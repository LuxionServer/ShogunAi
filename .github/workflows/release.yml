name: Release

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
    types: [closed]
    branches: [main]

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  resolve-version:
    if: >
      github.event_name == 'push' ||
      (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      ref: ${{ steps.version.outputs.ref }}
    steps:
      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            VERSION="${BRANCH#release/}"
            REF="$MERGE_SHA"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
            REF="$GITHUB_REF"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must match X.Y.Z (digits only), got: $VERSION" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

  test:
    name: Tests
    needs: resolve-version
    permissions:
      contents: read
    uses: ./.github/workflows/test-suite.yml
    with:
      ref: ${{ needs.resolve-version.outputs.ref }}

  package:
    name: Package
    needs: [resolve-version, test]
    permissions:
      contents: read
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}
      ref: ${{ needs.resolve-version.outputs.ref }}
    secrets: inherit

  smoke-test:
    name: Smoke test
    needs: [resolve-version, package]
    permissions:
      contents: read
    uses: ./.github/workflows/smoke-test.yml
    with:
      ref: ${{ needs.resolve-version.outputs.ref }}

  create-release:
    needs: [resolve-version, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.resolve-version.outputs.version }}
      REF: ${{ needs.resolve-version.outputs.ref }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.ref }}
          persist-credentials: false

      - name: Tag merge commit
        if: github.event_name == 'pull_request'
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/v${VERSION}" \
            -f sha="$REF"

      - name: Resolve release title
        id: title
        run: |
          TITLE_FILE=".github/release-title"
          FEATURE_TITLE=""
          if [ -f "$TITLE_FILE" ]; then
            FEATURE_TITLE="$(head -n 1 "$TITLE_FILE")"
          fi
          if [ -n "$FEATURE_TITLE" ]; then
            echo "value=v${VERSION} — ${FEATURE_TITLE}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::${TITLE_FILE} is empty or missing; the release will be titled v${VERSION}."
            echo "value=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft release
        env:
          RELEASE_TITLE: ${{ steps.title.outputs.value }}
        run: |
          ENGLISH_NOTES=".github/release-notes/${VERSION}.md"
          SPANISH_NOTES=".github/release-notes/${VERSION}.es.md"
          BODY_FILE="${RUNNER_TEMP}/release-notes.md"
          if [ -f "$ENGLISH_NOTES" ]; then
            {
              printf '<!-- shogunai:notes:en -->\n\n%s\n\n<!-- /shogunai:notes:en -->\n' "$(cat "$ENGLISH_NOTES")"
              if [ -f "$SPANISH_NOTES" ]; then
                printf '\n<details>\n<summary>Español</summary>\n\n<!-- shogunai:notes:es -->\n\n%s\n\n<!-- /shogunai:notes:es -->\n\n</details>\n' "$(cat "$SPANISH_NOTES")"
              fi
            } > "$BODY_FILE"
            if [ ! -f "$SPANISH_NOTES" ]; then
              echo "::warning::${SPANISH_NOTES} is missing; the release notes will only be in English."
            fi
            NOTES_ARGS=(--notes-file "$BODY_FILE")
          else
            MISSING="${ENGLISH_NOTES} is"
            if [ ! -f "$SPANISH_NOTES" ]; then
              MISSING="${ENGLISH_NOTES} and ${SPANISH_NOTES} are"
            fi
            echo "::warning::${MISSING} missing; the release will use GitHub's generated notes."
            NOTES_ARGS=(--generate-notes)
          fi
          gh release create "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TITLE" \
            --verify-tag \
            --draft \
            "${NOTES_ARGS[@]}"

  attest-assets:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: installer-*
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: cli
          path: dist

      - uses: actions/attest@v4
        with:
          subject-path: dist/*

  publish-release:
    needs: [resolve-version, create-release, attest-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: installer-*
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: cli
          path: dist

      - name: Write checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS

      - name: Upload assets and publish release
        run: |
          gh release upload "v${VERSION}" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "v${VERSION}" --repo "$GITHUB_REPOSITORY" --draft=false

  update-homebrew-cask:
    needs: [resolve-version, publish-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.ref }}
          path: source
          persist-credentials: false

      - name: Read checksums from the release
        id: sha
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}"
          curl -sL -f -o SHA256SUMS "${BASE_URL}/SHA256SUMS"
          echo "arm=$(grep -F " ShogunAi-${VERSION}-arm64.dmg" SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "intel=$(grep -F " ShogunAi-${VERSION}-x64.dmg" SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
          SHA256_ARM: ${{ steps.sha.outputs.arm }}
          SHA256_INTEL: ${{ steps.sha.outputs.intel }}
        run: |
          if [ -z "$SHA256_ARM" ] || [ -z "$SHA256_INTEL" ]; then
            echo "Missing dmg checksums in SHA256SUMS." >&2
            exit 1
          fi

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/LuxionServer/homebrew-shogunai.git" tap

          sed -e "s|@VERSION@|${VERSION}|" \
              -e "s|@SHA256_ARM@|${SHA256_ARM}|" \
              -e "s|@SHA256_INTEL@|${SHA256_INTEL}|" \
              source/.github/homebrew/shogunai.rb > tap/Casks/shogunai.rb

          cat tap/Casks/shogunai.rb

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/shogunai.rb

          if git diff --cached --quiet; then
            echo "Cask already up to date, nothing to commit."
          else
            git commit -m "Update shogunai cask to v${VERSION}"
            git push
          fi

  update-scoop-bucket:
    needs: [resolve-version, publish-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.ref }}
          path: source
          persist-credentials: false

      - name: Read checksum from the release
        id: sha
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}"
          curl -sL -f -o SHA256SUMS "${BASE_URL}/SHA256SUMS"
          echo "msi=$(grep -F " ShogunAi-${VERSION}.msi" SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Update Scoop bucket
        env:
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
          SHA256_MSI: ${{ steps.sha.outputs.msi }}
        run: |
          if [ -z "$SHA256_MSI" ]; then
            echo "Missing msi checksum in SHA256SUMS." >&2
            exit 1
          fi

          git clone "https://x-access-token:${SCOOP_BUCKET_TOKEN}@github.com/LuxionServer/scoop-shogunai.git" bucket
          mkdir -p bucket/bucket

          sed -e "s|@VERSION@|${VERSION}|g" \
              -e "s|@SHA256_MSI@|${SHA256_MSI}|" \
              source/.github/scoop/shogunai.json > bucket/bucket/shogunai.json

          cat bucket/bucket/shogunai.json

          cd bucket
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/shogunai.json

          if git diff --cached --quiet; then
            echo "Manifest already up to date, nothing to commit."
          else
            git commit -m "Update shogunai to v${VERSION}"
            git push
          fi

  update-winget:
    needs: [resolve-version, publish-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54
        with:
          identifier: LuxionServer.ShogunAi
          version: ${{ needs.resolve-version.outputs.version }}
          release-tag: v${{ needs.resolve-version.outputs.version }}
          installers-regex: '\.msi$'
          token: ${{ secrets.WINGET_TOKEN }}
