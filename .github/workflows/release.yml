name: Release

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  resolve-version:
    if: >
      github.event_name == 'push' ||
      (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.ref }}

      - name: Resolve version
        id: version
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            VERSION="${BRANCH#release/}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Tag merge commit
        if: github.event_name == 'pull_request'
        run: |
          git tag "v${{ steps.version.outputs.value }}" ${{ github.event.pull_request.merge_commit_sha }}
          git push origin "v${{ steps.version.outputs.value }}"

  create-release:
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.resolve-version.outputs.version }}
          draft: true
          generate_release_notes: true

  build:
    needs: [resolve-version, create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            task: packageReleaseDmg
            artifact-glob: desktopApp/build/compose/binaries/main-release/dmg/*.dmg
          - os: macos-26-intel
            task: packageReleaseDmg
            artifact-glob: desktopApp/build/compose/binaries/main-release/dmg/*.dmg
          - os: windows-latest
            task: packageReleaseMsi
            artifact-glob: desktopApp/build/compose/binaries/main-release/msi/*.msi
          - os: ubuntu-latest
            task: packageReleaseDeb
            artifact-glob: desktopApp/build/compose/binaries/main-release/deb/*.deb

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build installer
        run: ./gradlew :desktopApp:${{ matrix.task }} -PappVersion=${{ needs.resolve-version.outputs.version }}

      - name: Add architecture suffix to dmg
        if: runner.os == 'macOS'
        run: |
          ARCH="$(echo "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
          shopt -s nullglob
          DMGS=(desktopApp/build/compose/binaries/main-release/dmg/*.dmg)
          if [ "${#DMGS[@]}" -ne 1 ]; then
            echo "Expected exactly one dmg, found ${#DMGS[@]}." >&2
            exit 1
          fi
          mv "${DMGS[0]}" "${DMGS[0]%.dmg}-${ARCH}.dmg"

      - name: Upload asset to draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.resolve-version.outputs.version }}
          files: ${{ matrix.artifact-glob }}
          fail_on_unmatched_files: true
          draft: true

  build-cli:
    needs: [resolve-version, create-release]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build CLI zip
        run: ./gradlew :cli:distZip -PappVersion=${{ needs.resolve-version.outputs.version }}

      - name: Upload asset to draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.resolve-version.outputs.version }}
          files: cli/build/distributions/shogun-${{ needs.resolve-version.outputs.version }}.zip
          fail_on_unmatched_files: true
          draft: true

  publish-release:
    needs: [resolve-version, build, build-cli]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.resolve-version.outputs.version }}
          draft: false

  update-homebrew-cask:
    needs: [resolve-version, publish-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.ref }}
          path: source

      - name: Download macOS dmgs and compute sha256
        id: sha
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          DMG_VERSION="1.${VERSION#*.}"
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}"
          curl -sL -f -o arm64.dmg "${BASE_URL}/ShogunAi-${DMG_VERSION}-arm64.dmg"
          curl -sL -f -o x64.dmg "${BASE_URL}/ShogunAi-${DMG_VERSION}-x64.dmg"
          echo "arm=$(sha256sum arm64.dmg | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "intel=$(sha256sum x64.dmg | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
          SHA256_ARM: ${{ steps.sha.outputs.arm }}
          SHA256_INTEL: ${{ steps.sha.outputs.intel }}
        run: |
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/LuxionServer/homebrew-shogunai.git" tap

          sed -e "s|@VERSION@|${VERSION}|" \
              -e "s|@SHA256_ARM@|${SHA256_ARM}|" \
              -e "s|@SHA256_INTEL@|${SHA256_INTEL}|" \
              source/.github/homebrew/shogunai.rb > tap/Casks/shogunai.rb

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/shogunai.rb

          if git diff --cached --quiet; then
            echo "Cask already up to date, nothing to commit."
          else
            git commit -m "Update shogunai cask to v${VERSION}"
            git push
          fi

  update-scoop-bucket:
    needs: [resolve-version, publish-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.ref }}
          path: source

      - name: Download Windows msi and compute sha256
        id: sha
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}"
          curl -sL -f -o ShogunAi.msi "${BASE_URL}/ShogunAi-${VERSION}.msi"
          echo "msi=$(sha256sum ShogunAi.msi | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Update Scoop bucket
        env:
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
          SHA256_MSI: ${{ steps.sha.outputs.msi }}
        run: |
          git clone "https://x-access-token:${SCOOP_BUCKET_TOKEN}@github.com/LuxionServer/scoop-shogunai.git" bucket
          mkdir -p bucket/bucket

          sed -e "s|@VERSION@|${VERSION}|g" \
              -e "s|@SHA256_MSI@|${SHA256_MSI}|" \
              source/.github/scoop/shogunai.json > bucket/bucket/shogunai.json

          cd bucket
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/shogunai.json

          if git diff --cached --quiet; then
            echo "Manifest already up to date, nothing to commit."
          else
            git commit -m "Update shogunai to v${VERSION}"
            git push
          fi

  update-winget:
    needs: [resolve-version, publish-release]
    runs-on: ubuntu-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: LuxionServer.ShogunAi
          version: ${{ needs.resolve-version.outputs.version }}
          release-tag: v${{ needs.resolve-version.outputs.version }}
          installers-regex: '\.msi$'
          token: ${{ secrets.WINGET_TOKEN }}
