name: Tests

on:
  push:
    branches:
      - develop
      - "release/**"
  pull_request:
    branches:
      - develop
      - "epic/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    uses: ./.github/workflows/test-suite.yml
