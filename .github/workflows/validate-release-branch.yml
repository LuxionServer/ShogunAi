name: Validate Release Branch

on:
  push:
    branches:
      - "release/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test
