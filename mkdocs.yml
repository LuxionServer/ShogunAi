site_name: ShogunAi
site_description: KMP Desktop orchestrator for Git worktrees, Android environment bootstrapping, and AI agent workflow automation.
repo_name: ShogunAi
repo_url: https://github.com/LuxionServer/ShogunAi

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - scheme: default
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - git-revision-date
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: es
          name: Español
          build: true
          nav_translations:
            Home: Inicio
            Getting started: Primeros pasos
            Architecture: Arquitectura
            Overview: Visión general
            Domain layer: Capa de dominio
            Infrastructure layer: Capa de infraestructura
            UI layer: Capa de UI
            Development process: Proceso de desarrollo
            Branches: Ramas
            Design decisions: Decisiones de diseño
            Roadmap: Roadmap

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Architecture:
      - Overview: architecture/overview.md
      - Domain layer: architecture/domain.md
      - Infrastructure layer: architecture/infrastructure.md
      - UI layer: architecture/ui.md
  - Development process:
      - Branches: process/branching.md
      - OpenSpec: process/openspec.md
      - Release: process/release.md
  - Design decisions: decisions/index.md
  - Roadmap: roadmap.md
