site_name: ShogunAi
site_description: Desktop app and command-line tool that prepare Git worktrees for AI agents, with per-worktree environments and providers for Gradle, Android emulators, iOS simulators and Xcode.
repo_name: ShogunAi
repo_url: https://github.com/LuxionServer/ShogunAi

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - scheme: default
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - git-revision-date
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: es
          name: Español
          build: true
          nav_translations:
            Home: Inicio
            Getting started: Primeros pasos
            Architecture: Arquitectura
            Overview: Visión general
            Domain layer: Capa de dominio
            Infrastructure layer: Capa de infraestructura
            UI layer: Capa de UI
            Command-line tool: Línea de comandos
            Development process: Proceso de desarrollo
            Branches: Ramas
            Rehearsal: Ensayo
            Design decisions: Decisiones de diseño
            Roadmap: Roadmap
            Using with agents: Uso con agentes
            User guide: Guía de uso
            Installation: Instalación
            Desktop app: App de escritorio
            Command-line reference: Referencia de la línea de comandos
            Configuration: Configuración
            Providers: Providers
            Multirepos and groups: Multirepos y grupos
            Desktop app in the background: App de escritorio en segundo plano
            Release: Proceso de release

nav:
  - Home: index.md
  - User guide:
      - Installation: guide/installation.md
      - Desktop app: guide/desktop-app.md
      - Command-line reference: guide/cli.md
      - Configuration: guide/configuration.md
      - Providers: guide/providers.md
      - Multirepos and groups: guide/multirepo.md
      - Desktop app in the background: guide/headless-app.md
  - Using with agents: agents.md
  - Getting started: getting-started.md
  - Architecture:
      - Overview: architecture/overview.md
      - Domain layer: architecture/domain.md
      - Infrastructure layer: architecture/infrastructure.md
      - UI layer: architecture/ui.md
      - Command-line tool: architecture/cli.md
  - Development process:
      - Branches: process/branching.md
      - OpenSpec: process/openspec.md
      - Release: process/release.md
      - Rehearsal: process/rehearsal.md
  - Design decisions: decisions/index.md
  - Roadmap: roadmap.md
